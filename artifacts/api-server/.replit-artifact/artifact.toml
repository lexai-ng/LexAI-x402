kind = "api"
previewPath = "/"
title = "LexAI x402 Demo API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 3000
name = "API Server"
paths = ["/"]

[services.development]
run = "cd ../.. && node index.js"

[services.production]

[services.production.build]
args = ["node", "--check", "index.js"]

[services.production.run]
args = ["node", "index.js"]

[services.production.run.env]
PORT = "3000"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"
